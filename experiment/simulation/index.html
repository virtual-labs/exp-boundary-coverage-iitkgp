<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boundary Coverage Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .app-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0f2fe; /* Light blue background like the image */
        }
        .main-card {
            border: 1px solid #93c5fd;
            box-shadow: none;
            background-color: #ffffff;
            overflow: hidden;
            width: 100%;
            max-width: 55%;
        }
        .simulation-canvas {
            background-image: url('https://placehold.co/800x400/9ade74/000?text=Green+Field+Background');
            background-size: cover;
            background-position: center;
            width: 100%;
            height: 100%;
        }
        .info-box, .input-box {
            background-color: #dbeafe;
            border: 1px solid #60a5fa;
            border-radius: 0.25rem;
            padding: 0.75rem;
        }
        .reading-table-container {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #60a5fa;
            border-radius: 0.25rem;
        }
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .dialog-box {
            background-color: #e0f2fe;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 500px;
            border: 1px solid #60a5fa;
        }
        .table-header {
            background-color: #bfdbfe;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Styles copied from only expa.html for the simulation window */
        #simulation-display {
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            width: 900px;
            max-width: 900px;
            height: 158%;
        }
        #antenna {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            height: 211px;
            width: auto;
            z-index: 10;
        }
        #mobile {
            position: absolute;
            height: 40px;
            width: auto;
            z-index: 20;
            transform: translate(-50%, -50%);
            cursor: grab;
        }
        #mobile-tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            white-space: nowrap;
            pointer-events: none;
            transform: translate(-50%, -120%);
            z-index: 30;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .input-group button {
            background-color: #bfdbfe;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.js"></script>
</head>
<body class="bg-gray-100 p-4">

    <div id="custom-dialog" class="dialog-overlay hidden">
        <div class="dialog-box">
            <h3 id="dialog-title" class="text-xl font-bold mb-4"></h3>
            <p id="dialog-message" class="text-gray-700 mb-6"></p>
            <input type="text" id="dialog-input" class="w-full rounded-md border-gray-300 shadow-sm p-2 focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 hidden mb-6" placeholder="Your Name">
            <div class="flex justify-end space-x-2">
                <button id="dialog-ok" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">OK</button>
                <button id="dialog-cancel" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 hidden">Cancel</button>
            </div>
        </div>
    </div>

    <div id="app" class="app-container p-4 sm:p-6 lg:p-8">
        <div class="main-card bg-white rounded-xl overflow-hidden p-4 sm:p-6">
            <div class="grid grid-cols-[1fr_2.5fr_1fr] md:grid-cols-[1fr_2.5fr_1fr] gap-6 h-[80vh]">
                <div id="control-panel" class="md:col-span-1 p-4 space-y-4 flex flex-col justify-between">
                    <div id="start-screen" class="space-y-4 text-center">
                        <h3 class="text-xl font-semibold">Instructions</h3>
                        <p class="text-gray-600">Click the button below to start the experiment. You will be asked to enter your name.</p>
                        <button id="start-btn" class="w-full bg-blue-500 text-white font-bold py-3 rounded-lg hover:bg-blue-600 transition duration-300">START</button>
                    </div>

                    <div id="main-controls" class="space-y-4 flex flex-col justify-between h-full hidden">
                        
                        <div class="overflow-y-auto">
                            
                            <div class="input-box space-y-2 mb-4">
                                <label class="block text-sm font-medium text-gray-700">Distance(m):</label>
                                <div class="input-group">
                                    <button onclick="decrementInput('dist-input', 100)">-</button>
                                    <input id="dist-input" type="text" value="3000" class="w-full rounded-md border-gray-300 shadow-sm p-1">
                                    <button onclick="incrementInput('dist-input', 100)">+</button>
                                </div>
                                <label class="block text-sm font-medium text-gray-700">Pt(dBm):</label>
                                <div class="input-group">
                                    <button onclick="decrementInput('tx-power-input', 1.0)">-</button>
                                    <input id="tx-power-input" type="text" value="30.0" class="w-full rounded-md border-gray-300 shadow-sm p-1">
                                    <button onclick="incrementInput('tx-power-input', 1.0)">+</button>
                                </div>
                                <label class="block text-sm font-medium text-gray-700">fc(GHz):</label>
                                <div class="input-group">
                                    <button onclick="decrementInput('fc-input', 0.1)">-</button>
                                    <input id="fc-input" type="text" value="2.0" class="w-full rounded-md border-gray-300 shadow-sm p-1">
                                    <button onclick="incrementInput('fc-input', 0.1)">+</button>
                                </div>
                                <label class="block text-sm font-medium text-gray-700">Path Loss Exp (np):</label>
                                <div class="input-group">
                                    <button onclick="decrementInput('np-input', 0.1)">-</button>
                                    <input id="np-input" type="text" value="3.0" class="w-full rounded-md border-gray-300 shadow-sm p-1">
                                    <button onclick="incrementInput('np-input', 0.1)">+</button>
                                </div>
                                <button id="reset-btn" class="w-full bg-gray-400 text-white font-bold py-1 rounded-lg hover:bg-gray-500">Reset</button>
                            </div>
                            <div class="info-box space-y-2 mb-4 hidden" id="calculated-values-box">
                                <p class="text-sm font-medium">Threshold: <span id="threshold-display" class="font-bold">-</span> dBm</p>
                                <p class="text-sm font-medium">Pr Mean(dBm): <span id="pr-mean-display" class="font-bold">-</span></p>
                                <p class="text-sm font-medium">Sigma: <span id="sigma-display" class="font-bold">-</span></p>
                            </div>
                            

                            <div class="input-box space-y-2 mb-4">
                                <label class="block text-sm font-medium text-gray-700">Enter Area Coverage (%):</label>
                                <input id="entered-prob-input" type="text" class="w-full rounded-md border-gray-300 shadow-sm p-1" placeholder="e.g., 71.71">
                                <button id="check-btn" class="w-full bg-green-500 text-white font-bold py-1 rounded-lg hover:bg-green-600 transition duration-300 disabled:opacity-50" disabled>CHECK</button>
                                <p id="check-result" class="text-center font-bold text-gray-800 mt-2"></p>
                            </div>
                        </div>
                        
                        
                        <div class="space-y-2 self-end w-full">
                            <button id="submit-area-btn" class="w-full bg-blue-500 text-white font-bold py-2 rounded-lg hover:bg-blue-600 transition duration-300 disabled:opacity-50" disabled>Submit</button>
                            <button id="generate-report-btn" class="w-full bg-blue-500 text-white font-bold py-2 rounded-lg hover:bg-blue-600 transition duration-300 disabled:opacity-50" disabled>Generate Report</button>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-1 bg-gray-100 flex flex-col items-center p-4">
                    <div class="relative w-full flex-grow flex items-center justify-center">
                        <div id="simulation-display" class="relative w-full h-full rounded-lg overflow-hidden flex items-center justify-center">
                            <img id="antenna" src="tower.png" alt="Base Station Antenna">
                            <img id="mobile" src="mobile.png" alt="Mobile Device">
                            <div id="mobile-tooltip" class="hidden"></div>
                            <canvas id="simulation-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                        </div>
                    </div>
                    
                    <div class="w-full mt-4 flex items-center justify-center space-x-2 bg-gray-200 p-2 rounded-lg">
                        <button id="mobile-minus-btn" class="p-1 bg-gray-300 rounded-lg text-lg font-bold hover:bg-gray-400 transition disabled:opacity-50">-</button>
                        <input id="mobile-slider" type="range" min="0" max="100" value="50" class="w-full h-2 bg-gray-400 rounded-lg appearance-none cursor-pointer">
                        <button id="mobile-plus-btn" class="p-1 bg-gray-300 rounded-lg text-lg font-bold hover:bg-gray-400 transition disabled:opacity-50">+</button>
                    </div>
                    <p id="mobile-angle-display" class="mt-2 text-sm text-gray-600">Mobile Angle: <span id="current-angle" class="font-bold">180</span> deg</p>
                    
                    <div class="flex space-x-4 mt-2">
                        <button id="take-reading-btn" class="bg-yellow-500 text-gray-800 font-bold py-1 px-4 rounded-lg hover:bg-yellow-600 transition duration-300 disabled:opacity-50">Take Reading</button>
                        <button id="finish-btn" class="bg-red-500 text-white font-bold py-1 px-4 rounded-lg hover:bg-red-600 transition duration-300 disabled:opacity-50">FINISH</button>
                    </div>
                    <p id="reading-count-display" class="mt-2 text-sm font-medium text-gray-700">Readings: 0 / 40</p>
                    <p class="mt-2 text-xs text-gray-500">VLS FCMC IIT Kharagpur</p>
                </div>

                <div class="md:col-span-1 p-4 flex flex-col">
                    <h3 class="text-lg font-semibold mb-2 text-center">Pr(dBm) deg</h3>
                    <div class="reading-table-container flex-grow">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="table-header">
                                <tr>
                                    <th class="px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sr.No</th>
                                    <th class="px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pr(dBm)</th>
                                    <th class="px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">deg</th>
                                </tr>
                            </thead>
                            <tbody id="readings-table-body" class="bg-white divide-y divide-gray-200">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Use a self-invoking function to avoid global scope pollution
        (function() {
            const state = {
                userName: '',
                readings: [],
                prMean: null,
                sigma: null,
                mobileAngle: 180,
                // These are parameters from the instructions and theory documents
                txPower: 30.0, // dBm
                distance: 3000, // meters
                fc: 2.0, // GHz
                threshold: -90.0, // dBm
                d0: 100, // reference distance from theory.pdf
                shadowFadingSigma: 9.0 // sigma value from instructions.pdf for calculation validation
            };
            
            let isDragging = false;

            // DOM elements
            const startBtn = document.getElementById('start-btn');
            const startScreen = document.getElementById('start-screen');
            const mainControls = document.getElementById('main-controls');
            const readingsTableBody = document.getElementById('readings-table-body');
            const mobileSlider = document.getElementById('mobile-slider');
            const mobileMinusBtn = document.getElementById('mobile-minus-btn');
            const mobilePlusBtn = document.getElementById('mobile-plus-btn');
            const currentAngleDisplay = document.getElementById('current-angle');
            const takeReadingBtn = document.getElementById('take-reading-btn');
            const readingCountDisplay = document.getElementById('reading-count-display');
            const finishBtn = document.getElementById('finish-btn');
            const prMeanDisplay = document.getElementById('pr-mean-display');
            const sigmaDisplay = document.getElementById('sigma-display');
            const enteredProbInput = document.getElementById('entered-prob-input');
            const checkBtn = document.getElementById('check-btn');
            const checkResultDisplay = document.getElementById('check-result');
            
            const submitAreaBtn = document.getElementById('submit-area-btn');
            const generateReportBtn = document.getElementById('generate-report-btn');
            
            const resetBtn = document.getElementById('reset-btn');
            const distInput = document.getElementById('dist-input');
            const txPowerInput = document.getElementById('tx-power-input');
            const fcInput = document.getElementById('fc-input');
            const npInput = document.getElementById('np-input');
            const thresholdDisplay = document.getElementById('threshold-display');
            const calculatedValuesBox = document.getElementById('calculated-values-box');
            
            const simulationDisplay = document.getElementById('simulation-display');
            const antennaElement = document.getElementById('antenna');
            const mobileElement = document.getElementById('mobile');
            const mobileTooltip = document.getElementById('mobile-tooltip');
            
            const canvas = document.getElementById('simulation-canvas');
            const ctx = canvas.getContext('2d');
            
            const bgImage = new Image();
            bgImage.src = 'bg.png';
            const towerImage = new Image();
            towerImage.src = 'tower.png';
            const mobileImage = new Image();
            mobileImage.src = 'mobile.png';

            const customDialog = document.getElementById('custom-dialog');
            const dialogTitle = document.getElementById('dialog-title');
            const dialogMessage = document.getElementById('dialog-message');
            const dialogInput = document.getElementById('dialog-input');
            const dialogOkBtn = document.getElementById('dialog-ok');
            const dialogCancelBtn = document.getElementById('dialog-cancel');

            // --- Helper Functions ---

            function showMessage(title, message, isPrompt = false, callback = () => {}) {
                dialogTitle.textContent = title;
                dialogMessage.textContent = message;
                dialogInput.classList.add('hidden');
                customDialog.classList.remove('hidden');
                
                if (isPrompt) {
                    dialogInput.classList.remove('hidden');
                    dialogMessage.classList.add('hidden');
                    dialogCancelBtn.classList.remove('hidden');
                    dialogInput.value = ''; 
                    dialogOkBtn.onclick = () => {
                        customDialog.classList.add('hidden');
                        callback(dialogInput.value);
                    };
                    dialogCancelBtn.onclick = () => {
                        customDialog.classList.add('hidden');
                        callback(null);
                    };
                } else {
                    dialogMessage.classList.remove('hidden');
                    dialogInput.classList.add('hidden');
                    dialogCancelBtn.classList.add('hidden');
                    dialogOkBtn.onclick = () => {
                        customDialog.classList.add('hidden');
                        callback();
                    };
                }
            }
            
            function erf(x) {
                const a1 = 0.254829592;
                const a2 = -0.284496736;
                const a3 = 1.421413741;
                const a4 = -1.453152027;
                const a5 = 1.061405429;
                const p = 0.3275911;

                const sign = (x >= 0) ? 1 : -1;
                x = Math.abs(x);

                const t = 1.0 / (1.0 + p * x);
                const y = 1.0 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
                return sign * y;
            }

            function roundTo(num, decimals) {
                if (typeof num !== 'number' || isNaN(num)) return '-';
                const multiplier = Math.pow(10, decimals);
                return Math.round(num * multiplier) / multiplier;
            }

            function normalRand(mean, stdDev) {
                let u = 0, v = 0;
                while (u === 0) u = Math.random(); 
                while (v === 0) v = Math.random();
                const z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                return z * stdDev + mean;
            }

            function calculatePrd() {
                const txPower = parseFloat(txPowerInput.value);
                const distance = parseFloat(distInput.value);
                const np = parseFloat(npInput.value);
                
                if (isNaN(txPower) || isNaN(distance) || isNaN(np) || distance <= 0) {
                    return NaN;
                }
                
                const meanPrd = txPower - (10 * np * Math.log10(distance / state.d0));
                const shadowFading = normalRand(0, state.shadowFadingSigma);
                let receivedPower = meanPrd + shadowFading;

                return receivedPower;
            }

            // --- UI Rendering ---

            function updateMobilePositionAndCircle() {
                const simRect = simulationDisplay.getBoundingClientRect();
                const centerX = simRect.width / 2;
                const centerY = simRect.height * 0.7; 

                const antennaHeight = antennaElement.clientHeight;
                const towerTop = centerY - antennaHeight;
                antennaElement.style.top = `${towerTop}px`;
                
                const currentDistance = parseFloat(distInput.value);
                const baseOrbitRadius = Math.min(centerX, centerY) * 0.8;
                let scaledOrbitRadius = baseOrbitRadius;
                
                if (!isNaN(currentDistance) && currentDistance > 0) {
                    scaledOrbitRadius = (currentDistance / 3000) * baseOrbitRadius; // Calibrated for default 3000m
                    scaledOrbitRadius = Math.max(baseOrbitRadius * 0.3, Math.min(baseOrbitRadius * 1.5, scaledOrbitRadius));
                }

                const rx = scaledOrbitRadius;
                const ry = scaledOrbitRadius * 0.3; 
                const angle = (mobileSlider.value / 100) * 360; 
                state.mobileAngle = angle;
                currentAngleDisplay.textContent = roundTo(state.mobileAngle, 1);
                const angleRad = (angle - 90) * Math.PI / 180;
                
                const mobileX = centerX + rx * Math.cos(angleRad);
                const mobileY = centerY + ry * Math.sin(angleRad);
                
                mobileElement.style.left = `${mobileX}px`;
                mobileElement.style.top = `${mobileY}px`;

                canvas.width = simRect.width;
                canvas.height = simRect.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, rx, ry, 0, 0, 2 * Math.PI);
                ctx.stroke();

                const prd = calculatePrd();
                
                mobileTooltip.innerHTML = `Pr(dBm): ${roundTo(prd, 2)}<br>Deg: ${roundTo(state.mobileAngle, 1)}`;
                mobileTooltip.style.left = `${mobileX}px`;
                mobileTooltip.style.top = `${mobileY}px`;
                mobileTooltip.classList.remove('hidden');
            }

            function updateReadingsTable() {
                readingsTableBody.innerHTML = '';
                state.readings.forEach((reading, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-2 py-1 whitespace-nowrap text-sm font-medium text-gray-900">${index + 1}</td>
                        <td class="px-2 py-1 whitespace-nowrap text-sm text-gray-500">${roundTo(reading.prDbm, 2)}</td>
                        <td class="px-2 py-1 whitespace-nowrap text-sm text-gray-500">${roundTo(reading.angle, 1)}</td>
                    `;
                    readingsTableBody.appendChild(row);
                });
                readingCountDisplay.textContent = `Readings: ${state.readings.length} / 40`;
            }

            // --- Event Handlers ---
            window.incrementInput = function(id, step) {
                const input = document.getElementById(id);
                if (input) {
                    let value = parseFloat(input.value);
                    if (!isNaN(value)) {
                        value += step;
                         if (id === 'dist-input') {
                            input.value = value.toFixed(0);
                        } else {
                            input.value = value.toFixed(1);
                        }
                        input.dispatchEvent(new Event('input'));
                    }
                }
            }
            window.decrementInput = function(id, step) {
                const input = document.getElementById(id);
                if (input) {
                    let value = parseFloat(input.value);
                    if (!isNaN(value)) {
                        value -= step;
                        if (id === 'dist-input') {
                            input.value = value.toFixed(0);
                        } else {
                            input.value = value.toFixed(1);
                        }
                        input.dispatchEvent(new Event('input'));
                    }
                }
            }

            function onStart() {
                showMessage('What is your name?', 'Please enter your name to start the experiment.', true, (name) => {
                    if (name) {
                        state.userName = name;
                        startScreen.classList.add('hidden');
                        mainControls.classList.remove('hidden');
                        updateMobilePositionAndCircle();
                        takeReadingBtn.disabled = false;
                        resetBtn.disabled = false;
                    } else {
                        showMessage('Experiment Canceled', 'You must enter a name to proceed.');
                    }
                });
            }

            function onTakeReading() {
                if (state.readings.length < 40) {
                    const currentAngle = state.mobileAngle;
                    
                    const prDbmString = mobileTooltip.innerHTML.split('Pr(dBm): ')[1].split('<')[0];
                    const currentPrDbm = parseFloat(prDbmString);
                    
                    if (isNaN(currentPrDbm)) {
                        showMessage('Reading Error', 'Cannot take a reading with invalid parameters. Please check your inputs.');
                        return;
                    }

                    const newReading = { prDbm: currentPrDbm, angle: currentAngle };
                    state.readings.push(newReading);
                    updateReadingsTable();
                    
                    if (state.readings.length === 40) {
                        takeReadingBtn.disabled = true;
                        finishBtn.disabled = false;
                        showMessage('Readings Complete', 'You have taken 40 readings. Please click FINISH.');
                    }
                }
            }

            function onFinish() {
                if (state.readings.length === 0) {
                    showMessage('Error', 'Please take at least one reading before finishing the experiment.');
                    return;
                }

                const sum = state.readings.reduce((acc, curr) => acc + curr.prDbm, 0);
                state.prMean = sum / state.readings.length;
                
                const varianceSum = state.readings.reduce((acc, curr) => acc + Math.pow(curr.prDbm - state.prMean, 2), 0);
                state.sigma = Math.sqrt(varianceSum / state.readings.length);
                
                thresholdDisplay.textContent = roundTo(state.threshold, 2) + ' dBm';
                prMeanDisplay.textContent = roundTo(state.prMean, 2) + ' dBm';
                sigmaDisplay.textContent = roundTo(state.sigma, 2);
                
                calculatedValuesBox.classList.remove('hidden');
                checkBtn.disabled = false;
                showMessage('Calculation Done', 'Mean and Sigma values have been calculated. You can now check your area coverage value.');
            }

            function onCheck() {
                const userProb = parseFloat(enteredProbInput.value);
                if (isNaN(userProb)) {
                    showMessage('Input Error', 'Please enter a valid number for Area Coverage.');
                    return;
                }

                const sigma = state.sigma;
                const np = parseFloat(npInput.value);

                if (sigma === null || isNaN(sigma) || sigma <= 0 || isNaN(np)) {
                    showMessage('Calculation Error', 'Cannot calculate Area Coverage. Please finish the experiment to get a valid Sigma, and ensure Path Loss Exponent (np) is a valid number.');
                    return;
                }
                
                // As per the example, area coverage calculation assumes ProbR_r=0.5 at the cell edge, which means a=0.
                const a = 0; 
                const b = (10 * np * Math.log10(Math.E)) / (sigma * Math.SQRT2);

                if (isNaN(b) || b === 0) {
                    showMessage('Calculation Error', 'Parameter "b" is invalid. Check sigma and np values.');
                    return;
                }
                
                // Area Coverage Formula from example for a=0: F_u = 0.5 * [1 + exp(1/b^2) * (1 - erf(1/b))] * 100
                const computedAreaCoverage = 0.5 * (1 + Math.exp(1 / (b * b)) * (1 - erf(1 / b))) * 100;
                const roundedComputedProb = roundTo(computedAreaCoverage, 2);
                
                let message = `Computed Area Coverage: ${roundedComputedProb}%.`;
                let valuesMatch = false;

                if (Math.abs(userProb - roundedComputedProb) < 0.1) {
                    message += `\nYour entered value is correct!`;
                    checkResultDisplay.classList.remove('text-red-500');
                    checkResultDisplay.classList.add('text-green-500');
                    valuesMatch = true;
                } else {
                    message += `\nYour entered value (${userProb}%) does not match. The correct value is ${roundedComputedProb}%.`;
                    checkResultDisplay.classList.remove('text-green-500');
                    checkResultDisplay.classList.add('text-red-500');
                }
                
                // This implements your request:
                submitAreaBtn.disabled = false;
                generateReportBtn.disabled = true; // Ensure report button stays disabled
                
                showMessage('Check Result', message);
            }

            function onSubmitArea() {
                // This implements your request:
                generateReportBtn.disabled = false; // Report button is activated here
                submitAreaBtn.disabled = true; // Disable itself after clicking
                showMessage('Submitted', 'You can now generate the report.');
            }

            async function onGenerateReport() {
                if (state.readings.length === 0) {
                    showMessage('Error', 'Please perform the experiment first by taking readings.');
                    return;
                }
                if (typeof window.jspdf === 'undefined' || typeof window.jspdf.jsPDF === 'undefined') {
                    showMessage('Error', 'PDF library not loaded. Please try again or refresh the page.');
                    return;
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const now = new Date();
                const formattedDate = now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                const formattedTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

                let y = 20;
                doc.setFontSize(18);
                doc.text('Fading Channels & Mobile Communications', 10, y);
                y += 7;
                doc.setFontSize(12);
                doc.text('IIT Kharagpur', 10, y);
                y += 10;
                doc.setFontSize(14);
                doc.text('Exp 4: Boundary Coverage', 10, y);
                y += 7;
                doc.text(`Date: ${formattedDate} ${formattedTime}`, 10, y);
                y += 7;
                doc.text(`Name: ${state.userName}`, 10, y);
                y += 15;

                const paramHeaders = ['Tx.Power', 'Dist', 'fc', 'np', 'Pr(Th)', 'Pr(Mean)', 'Sigma', 'Calc. Area Cov(%)', 'Entered Area Cov.(%)'];
                
                const np = parseFloat(npInput.value);
                const b = (10 * np * Math.log10(Math.E)) / (state.sigma * Math.SQRT2);
                const calculatedAreaCoverage = 0.5 * (1 + Math.exp(1 / (b * b)) * (1 - erf(1 / b))) * 100;
                
                const paramData = [[
                    `${txPowerInput.value} dBm`,
                    `${distInput.value} m`,
                    `${fcInput.value} GHz`,
                    `${npInput.value}`,
                    `${state.threshold} dBm`,
                    `${roundTo(state.prMean, 2)}`,
                    `${roundTo(state.sigma, 2)}`,
                    `${roundTo(calculatedAreaCoverage, 2)} %`,
                    `${enteredProbInput.value} %`
                ]];

                doc.autoTable({
                    startY: y,
                    head: [paramHeaders],
                    body: paramData,
                    styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
                    headStyles: { fillColor: [200, 200, 200], textColor: [0, 0, 0] },
                });
                
                y = doc.autoTable.previous.finalY + 10;
                const readingsHeaders = ['Sr.No', 'Pr(dBm)', 'Angle(deg)'];
                const readingsData = state.readings.map((r, i) => [i + 1, roundTo(r.prDbm, 2), roundTo(r.angle, 1)]);

                doc.autoTable({ startY: y, head: [readingsHeaders], body: readingsData, styles: { fontSize: 8, cellPadding: 1, overflow: 'linebreak' }, headStyles: { fillColor: [200, 200, 200], textColor: [0, 0, 0] } });

                const finalY = doc.internal.pageSize.height - 30;
                doc.setFontSize(12);
                doc.text('(Signature of the Candidate)', 10, finalY);
                doc.text('(Signature of Faculty)', doc.internal.pageSize.width - 70, finalY);
                doc.save('BoundaryCoverage_Report.pdf');
                showMessage('Report Generated', 'Your report has been generated successfully and downloaded as a PDF.');
            }

            function onReset() {
                state.readings = [];
                state.prMean = null;
                state.sigma = null;
                state.mobileAngle = 180;
                mobileSlider.value = 50;

                distInput.value = "3000";
                txPowerInput.value = "30.0";
                fcInput.value = "2.0";
                npInput.value = "3.0";

                updateReadingsTable();
                prMeanDisplay.textContent = '-';
                sigmaDisplay.textContent = '-';
                thresholdDisplay.textContent = '-';
                enteredProbInput.value = '';
                checkResultDisplay.textContent = '';
                takeReadingBtn.disabled = false;
                finishBtn.disabled = true;
                checkBtn.disabled = true;
                
                submitAreaBtn.disabled = true;
                generateReportBtn.disabled = true;
                
                updateMobilePositionAndCircle();
                calculatedValuesBox.classList.add('hidden');
                showMessage('Reset', 'The experiment has been reset. You can start over.');
            }

            mobileElement.addEventListener('mousedown', (e) => { isDragging = true; mobileElement.style.cursor = 'grabbing'; });
            window.addEventListener('mouseup', () => { isDragging = false; mobileElement.style.cursor = 'grab'; });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const simRect = simulationDisplay.getBoundingClientRect();
                    const centerX = simRect.width / 2;
                    const centerY = simRect.height * 0.7; 
                    const mouseX = e.clientX - simRect.left;
                    const mouseY = e.clientY - simRect.top;
                    let angleRad = Math.atan2(mouseY - centerY, mouseX - centerX);
                    let angleDeg = (angleRad * 180 / Math.PI + 90 + 360) % 360; 
                    state.mobileAngle = angleDeg;
                    mobileSlider.value = (angleDeg / 360) * 100;
                    updateMobilePositionAndCircle();
                }
            });

            function onParamInputChange() { updateMobilePositionAndCircle(); }
            function onMobileSliderChange() { updateMobilePositionAndCircle(); }
            function onMobilePlus() { let c = parseInt(mobileSlider.value); if (c < 100) { mobileSlider.value = c + 1; updateMobilePositionAndCircle(); } }
            function onMobileMinus() { let c = parseInt(mobileSlider.value); if (c > 0) { mobileSlider.value = c - 1; updateMobilePositionAndCircle(); } }
            
            let imagesLoaded = 0;
            const imagesToLoad = 3;
            function onAllImagesLoaded() { if (++imagesLoaded === imagesToLoad) init(); }
            bgImage.onload = onAllImagesLoaded;
            towerImage.onload = onAllImagesLoaded;
            mobileImage.onload = onAllImagesLoaded;
            
            function resizeSimulationDisplay() {
                const parentDiv = simulationDisplay.parentElement;
                const size = Math.min(parentDiv.clientWidth, parentDiv.clientHeight);
                simulationDisplay.style.width = `${size}px`;
                simulationDisplay.style.height = `${size}px`;
                updateMobilePositionAndCircle();
            }

            function init() {
                resizeSimulationDisplay();
                window.addEventListener('resize', resizeSimulationDisplay);
                
                startBtn.addEventListener('click', onStart);
                takeReadingBtn.addEventListener('click', onTakeReading);
                finishBtn.addEventListener('click', onFinish);
                checkBtn.addEventListener('click', onCheck);
                
                submitAreaBtn.addEventListener('click', onSubmitArea);
                generateReportBtn.addEventListener('click', onGenerateReport);
                
                resetBtn.addEventListener('click', onReset);
                mobileSlider.addEventListener('input', onMobileSliderChange);
                mobilePlusBtn.addEventListener('click', onMobilePlus);
                mobileMinusBtn.addEventListener('click', onMobileMinus);
                distInput.addEventListener('input', onParamInputChange);
                txPowerInput.addEventListener('input', onParamInputChange);
                fcInput.addEventListener('input', onParamInputChange);
                npInput.addEventListener('input', onParamInputChange);
            }
        })();
    </script>
</body>
</html>
